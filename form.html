<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Pendaftaran</title>
</head>
<body style="background-color: #E6D8C3;">
    <header style="background-color: #C2A68C;">
        <h1 style="text-align: center;">Company Tim 2</h1>
        <nav>
            <ul>
                <li>
                    <a href="index.html" style="color: white; text-decoration: none;">Home</a>
                </li>
            </ul>
        </nav>
    </header>
    <main>
        <form action="">
            <section>
                <fieldset>
                    <legend>Contact Customer Support</legend>
                    <label for="firstname">First Name</label><br>
                    <input type="text" name="firstname" id="firstname" placeholder="First Name" required><br><br>
                    <label for="lastname">Last Name</label><br>
                    <input type="text" name="lastname" id="lastname" placeholder="Last Name" required><br><br>
                    <label for="email">Email Addres</label><br>
                    <input type="email" name="email" id="email" placeholder="you@example.com" required><br><br>
                    <label for="phonenumber">Phone Number</label><br>
                    <input type="number" name="phonenumber" id="phonenumber" placeholder="Phone Number" required><br><br>
                    <label for="reason">Reason For Contact</label><br>
                    <select name="reason" id="reason">
                        <option value="" disabled selected>-- Choose your reason contacting us --</option>
                        <option value="technical_issue_/defect">Technical Issue/Defect</option>
                        <option value="billing_/payment_inquiry">Billing/Payment Inquiry</option>
                        <option value="product_information_/how_-to">Product Information/How-To</option>
                        <option value="order_/shipping_status">Order/Shipping Status</option>
                    </select> 
                </fieldset>
            </section>
            <button type="reset">Reset Form</button>
            <button type="submit">Submit Form</button>
        </form>
    </main>
    <footer style="background-color: #C2A68C; padding: 5px; text-align: center;">
        <b><p>Copyright 2025, Tim 2 Hidup HTML</p></b>
    </footer>
</body>
</html>
